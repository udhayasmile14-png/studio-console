<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Console - Photography Studio Admin</title>
  
  <!-- Google Fonts: Cormorant Garamond 600, Inter 400/500/600 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">Studio Console</div>
      <nav id="sidebar-nav" aria-label="Main Navigation">
        <!-- Dynamically rendered by app.js -->
      </nav>
    </aside>

    <!-- Main Wrapper (Top Bar + Main Body) -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="top-bar">
        <input type="search" class="search-input" placeholder="Search clients, events, invoices" aria-label="Search">
        <div class="top-bar-right">
          <button type="button" class="btn" onclick="toast('New event created')">New event</button>
          <div class="avatar" aria-label="User profile">S</div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main id="main-content">
        <!-- Dynamically rendered view by app.js -->
      </main>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast-msg" role="status" aria-live="polite"></div>

  <!-- Script order: helpers -> modules-config -> 6 module files -> app.js -->
  <script src="js/helpers.js"></script>
  <script src="js/modules-config.js"></script>
  <script src="js/modules/photos.js"></script>
  <script src="js/modules/albums.js"></script>
  <script src="js/modules/video.js"></script>
  <script src="js/modules/invites.js"></script>
  <script src="js/modules/pay.js"></script>
  <script src="js/modules/data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
