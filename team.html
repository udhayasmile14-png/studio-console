<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team | Studio Console</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Authentication Guard -->
  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
</head>
<body>

  <div class="app-shell">
    
    <!-- Floating Card Sidebar Column -->
    <aside class="sidebar-column" id="sidebarCol">
      <div class="side">
        <div class="side-brand">
          <div class="side-brand-icon"><i class="ti ti-camera"></i></div>
          <span class="side-brand-name">Studio Console</span>
        </div>
        <nav class="side-nav" id="sidebar-nav" aria-label="Main Navigation"></nav>
        <div class="side-user">
          <div class="side-user-info">
            <div class="side-user-avatar">S</div>
            <div>
              <div style="font-weight: 600; font-size: 13px;">Sana</div>
              <div style="font-size: 11px; color: var(--muted);">Owner</div>
            </div>
          </div>
          <button type="button" class="lnk" onclick="logout()" title="Sign Out" style="color: var(--error);">
            <i class="ti ti-logout" style="font-size: 18px;"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Body -->
    <main class="app-main">
      
      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="menu-drawer-toggle" onclick="toggleDrawer()" aria-label="Toggle Navigation">
            <i class="ti ti-menu-2"></i>
          </button>
          <div class="topbar-search" id="topbarSearch">
            <i class="ti ti-search"></i>
            <input type="text" placeholder="Search team..." aria-label="Search">
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <!-- Main Team View -->
      <div id="main-content">
        <div style="margin-bottom: 20px;">
          <h1>Studio Team & Crew</h1>
          <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">Photographers, videographers, editors, and event assignments.</p>
        </div>

        <!-- Metrics Row -->
        <div class="stats-grid" style="margin-bottom: 20px;">
          <div class="glass-panel" style="padding: 16px;">
            <div class="stat-card-title"><span>Total Crew</span><i class="ti ti-users"></i></div>
            <div class="stat-card-val">5 Members</div>
          </div>
          <div class="glass-panel" style="padding: 16px;">
            <div class="stat-card-title"><span>On Shoot Today</span><i class="ti ti-camera"></i></div>
            <div class="stat-card-val" style="color: var(--gold);">2 On Field</div>
          </div>
          <div class="glass-panel" style="padding: 16px;">
            <div class="stat-card-title"><span>Available</span><i class="ti ti-check-circle"></i></div>
            <div class="stat-card-val" style="color: var(--success);">2 Ready</div>
          </div>
        </div>

        <!-- Filter Chips -->
        <div class="chip-group" id="teamFilterChips">
          <button type="button" class="chip active" onclick="filterTeam('all', this)">All Members (5)</button>
          <button type="button" class="chip" onclick="filterTeam('On Assignment', this)">On Assignment</button>
          <button type="button" class="chip" onclick="filterTeam('Available', this)">Available</button>
          <button type="button" class="chip" onclick="filterTeam('Off Duty', this)">Off Duty</button>
        </div>

        <!-- Team Member Cards Grid -->
        <div class="grid-auto-fit" id="teamGridContainer"></div>

        <!-- Extra State Container -->
        <div id="teamStateContainer"></div>
      </div>

    </main>
  </div>

  <!-- Invite Member Modal -->
  <div class="modal-overlay" id="inviteMemberModal" onclick="if(event.target===this)closeModal('inviteMemberModal')">
    <div class="glass-card modal-card">
      <h2 style="margin-bottom: 6px;">Invite Team Member</h2>
      <p style="color: var(--muted); font-size: 13px; margin: 0 0 18px 0;">Add a new crew member or editor to your studio.</p>
      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600;">Full Name <input type="text" id="memberNameInput" placeholder="e.g. Rahul Sharma"></label>
        <label style="font-size: 13px; font-weight: 600;">Email Address <input type="text" placeholder="rahul@studioconsole.in"></label>
        <label style="font-size: 13px; font-weight: 600;">Role <select style="font-size: 13px;"><option>Lead Photographer</option><option>Senior Album Editor</option><option>Drone Pilot</option><option>Assistant</option></select></label>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="btn-ghost" onclick="closeModal('inviteMemberModal')">Cancel</button>
        <button type="button" class="btn-gold" onclick="submitInviteMember()">Send Invitation</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast" class="toast-msg" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/helpers.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      renderShell({
        active: 'team',
        searchPlaceholder: 'Search team...',
        actions: [
          { label: 'Invite member', variant: 'gold', onclick: "openModal('inviteMemberModal')", icon: 'ti-user-plus' }
        ]
      });

      renderTeamGrid('all');
    });

    function renderTeamGrid(filter) {
      var container = document.getElementById('teamGridContainer');
      if (!container || !MOCK_DATA.teamMembers) return;

      var filtered = MOCK_DATA.teamMembers.filter(function(t) {
        if (filter === 'all') return true;
        return t.status === filter;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        document.getElementById('teamStateContainer').innerHTML = renderEmptyState('No team members found', 'Try selecting a different status filter above.', 'ti-user-off');
        return;
      }

      document.getElementById('teamStateContainer').innerHTML = '';

      container.innerHTML = filtered.map(function(m) {
        return '<div class="glass-card" style="padding: 20px; display: flex; flex-direction: column; justify-content: space-between;">' +
          '<div>' +
            '<div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">' +
              '<div style="display: flex; gap: 12px; align-items: center;">' +
                '<div style="width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px;">' + m.avatar + '</div>' +
                '<div>' +
                  '<h3 style="font-size: 1.2rem; margin: 0;">' + m.name + '</h3>' +
                  '<div style="font-size: 12px; color: var(--muted);">' + m.role + '</div>' +
                '</div>' +
              '</div>' +
              '<span class="badge badge-' + m.statusKind + '">' + m.status + '</span>' +
            '</div>' +
            '<div style="font-size: 13px; color: var(--muted); margin-bottom: 14px;">' +
              '<div><i class="ti ti-phone"></i> ' + m.phone + '</div>' +
              '<div style="margin-top: 4px;"><strong>Assignment:</strong> ' + m.assignment + '</div>' +
            '</div>' +
          '</div>' +
          '<button type="button" class="btn-ghost" style="width: 100%; font-size: 13px;" onclick="toast(\'Assign event popup for ' + m.name + '\')">' +
            '<i class="ti ti-calendar-plus"></i> Assign Event' +
          '</button>' +
        '</div>';
      }).join('');
    }

    function filterTeam(filter, btn) {
      var chips = document.querySelectorAll('#teamFilterChips .chip');
      chips.forEach(function(c) { c.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      renderTeamGrid(filter);
    }

    function submitInviteMember() {
      var name = document.getElementById('memberNameInput').value.trim();
      if (!name) name = 'Rahul Sharma';
      closeModal('inviteMemberModal');
      toast('Invitation sent to ' + name);
    }
  </script>
</body>
</html>
