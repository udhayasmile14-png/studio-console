<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in | Studio Console</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #F6F2EA;
  --ink: #14171F;
  --muted: #5B6474;
  --gold: #D4A857;
  --line: #E3DCCD;
  --s: 1;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }

html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(900px 600px at 28% 55%, #FFF4DC 0, transparent 60%),
              radial-gradient(700px 500px at 95% 0, #F3E6D2 0, transparent 60%),
              linear-gradient(160deg, #F9F5EC, #EFE6D6);
  color: var(--ink);
  font: 15px/1.5 Inter, system-ui, sans-serif;
  overflow-x: hidden;
}

.page::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: conic-gradient(from 195deg at 18% -10%, transparent 0 6deg, rgba(255,226,160,.25) 8deg 12deg, transparent 14deg 22deg, rgba(255,226,160,.15) 24deg 27deg, transparent 29deg);
}

.page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 3fr 2fr;
  align-items: center;
  position: relative;
  padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}

.logo {
  position: absolute;
  left: 32px;
  top: 28px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 3;
  animation: rise .8s cubic-bezier(.2,.7,.2,1) both;
}

.mark {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #14171F;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.mark svg { width: 20px; height: 20px; }
.name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.3rem; line-height: 1; }

/* ---------- 3D Scene Styling ---------- */
#sw { position: relative; height: calc(660px * var(--s)); overflow: hidden; }
.scene {
  position: absolute;
  left: 50%;
  top: 0;
  width: 840px;
  height: 660px;
  margin-left: -420px;
  transform: scale(var(--s));
  transform-origin: top center;
  perspective: 1400px;
  --k: 1;
}

.o { position: absolute; transform-style: preserve-3d; }
.ent { animation: enter 1.2s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--dl,0s); }
@keyframes enter {
  from { opacity: 0; transform: translate3d(var(--ex,0), var(--ey,0), 0) scale(.92); }
  to { opacity: 1; transform: none; }
}

.par {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
  transform: translate3d(calc(var(--mx,0) * var(--d,1) * var(--k) * 26px), calc(var(--my,0) * var(--d,1) * var(--k) * 18px), var(--z,0px))
             rotateY(calc(var(--mx,0) * var(--d,1) * var(--k) * 6deg))
             rotateX(calc(var(--my,0) * var(--d,1) * var(--k) * -5deg));
}

.fl {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  animation: float var(--t,8s) ease-in-out infinite alternate;
  animation-delay: var(--dl2,0s);
}
@keyframes float {
  from { transform: translate3d(0,-8px,0) rotateY(-4deg) rotateX(1deg); }
  to { transform: translate3d(0,8px,0) rotateY(4deg) rotateX(-1deg); }
}

.fl.dr { animation-name: drift; }
@keyframes drift {
  0% { transform: translate3d(-14px,-10px,0); }
  50% { transform: translate3d(12px,14px,0); }
  100% { transform: translate3d(-6px,-18px,0); }
}

.hv { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.bl .hv { filter: blur(var(--bl,2px)); }
.cam:hover .hv { transform: translateZ(60px) rotateY(-8deg) scale(1.04); }
.alb:hover .hv { transform: translate3d(0,-14px,30px); }
.card3:hover .hv { transform: scale(1.07) translateZ(20px); }

/* Pedestal */
.ped { position: relative; width: 560px; height: 560px; transform: rotateX(72deg); transform-style: preserve-3d; }
.ped i { position: absolute; border-radius: 50%; }
.ped i:nth-child(1) { inset: 0; background: #E2D7C0; }
.ped i:nth-child(2) { inset: 36px; background: #EFE6D3; border: 1px solid rgba(212,168,87,.55); transform: translateZ(14px); }
.ped i:nth-child(3) { inset: 76px; background: #F8F3E8; transform: translateZ(28px); }
.ped i:nth-child(4) { inset: 110px; border: 2px solid rgba(212,168,87,.5); transform: translateZ(29px); animation: glw 6s ease-in-out infinite alternate; }
@keyframes glw { from { opacity: .3; } to { opacity: .95; } }

.glow { width: 780px; height: 330px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,206,120,.5), transparent); }
.shd { width: 380px; height: 64px; border-radius: 50%; background: radial-gradient(closest-side, rgba(20,23,31,.3), transparent); }

/* Album */
.ain { position: relative; width: 360px; height: 236px; transform: rotateX(46deg) rotateZ(-7deg); transform-style: preserve-3d; }
.cvr { position: absolute; inset: -12px -12px -14px; background: #2B2F3E; border-radius: 14px; transform: translateZ(-16px); }
.pe { position: absolute; top: 0; width: 180px; height: 236px; background: #EFE7D6; border: 1px solid #D4C8AE; }
.pg { position: absolute; top: 0; width: 180px; height: 236px; }
.pg.l { left: 0; background: linear-gradient(90deg, #FBF7EE 55%, #E6DCC6); border-radius: 6px 0 0 6px; transform: rotateY(11deg); transform-origin: right center; }
.pg.r { left: 180px; background: linear-gradient(270deg, #FBF7EE 55%, #E6DCC6); border-radius: 0 6px 6px 0; transform: rotateY(-11deg); transform-origin: left center; }
.pt { position: absolute; background: #fff; padding: 4px; box-shadow: 0 5px 9px -5px rgba(0,0,0,.4); }
.pt i, .fpf i { display: block; width: 100%; height: 100%; }

/* Camera */
.cm { position: relative; width: 250px; height: 150px; transform-style: preserve-3d; animation: camrot 14s ease-in-out infinite alternate; }
@keyframes camrot { from { transform: rotateY(-20deg) rotateX(4deg); } to { transform: rotateY(8deg) rotateX(-2deg); } }
.cm > div { position: absolute; }
.cmk { inset: 0; border-radius: 16px; background: #0F121A; transform: translateZ(-34px); }
.cmb { inset: 0; border-radius: 16px; background: linear-gradient(180deg, #2B3042, #191C28); }
.cmt { left: 0; right: 0; top: 0; height: 36px; border-radius: 16px 16px 0 0; background: linear-gradient(180deg, #E6E8ED, #A8ADB8); }
.cmp { left: 84px; top: -22px; width: 72px; height: 30px; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, #D5D8DF, #A8ADB8); }
.cmd { right: 48px; top: -9px; width: 36px; height: 14px; border-radius: 4px; background: linear-gradient(180deg, #E8C879, #B8903F); }
.cmg { right: 0; top: 36px; bottom: 0; width: 46px; border-radius: 0 0 16px 0; background: repeating-linear-gradient(180deg, #3A4054 0 5px, #2E3345 5px 8px); }
.lns { left: 50px; top: 28px; width: 124px; height: 124px; transform-style: preserve-3d; }
.gl { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.6) 48%, transparent 60%); animation: gl 5s ease-in-out infinite alternate; }
@keyframes gl { from { opacity: .1; transform: translateZ(56px) rotate(0); } to { opacity: .9; transform: translateZ(56px) rotate(40deg); } }

/* Film Strip */
.sr { position: absolute; left: 0; top: 0; transform-style: preserve-3d; animation: wave 12s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotateY(-9deg) translate3d(-16px,-6px,0); } to { transform: rotateY(9deg) translate3d(16px,8px,0); } }
.fs { position: absolute; left: -35px; top: -52px; width: 70px; height: 104px; background: #1B1E2A; border-radius: 3px; }
.fs::before, .fs::after { content: ""; position: absolute; left: 0; right: 0; height: 7px; background: repeating-linear-gradient(90deg, transparent 0 5px, #F3EDE0 5px 9px, transparent 9px 14px); }
.fs::before { top: 5px; } .fs::after { bottom: 5px; }
.fs b { position: absolute; inset: 17px 6px; border-radius: 2px; overflow: hidden; }
.fs b i { display: block; width: 100%; height: 100%; }

/* Polaroid cards & small objects */
.fp { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(-14deg) rotateZ(var(--r,-5deg)); }
.fpb { position: absolute; inset: 0; background: #D8CFBB; border-radius: 5px; transform: translateZ(-4px); }
.fpf { position: absolute; inset: 0; background: #fff; border-radius: 5px; padding: 6px 6px 16px; box-shadow: 0 20px 28px -14px rgba(20,23,31,.45); }
.fpf i { border-radius: 2px; }

.sd { width: 46px; height: 58px; background: linear-gradient(160deg, #3A4054, #1B1E2A); clip-path: polygon(0 0, 70% 0, 100% 22%, 100% 100%, 0 100%); position: relative; transform: rotateY(-20deg) rotateZ(10deg); }
.sd::after { content: ""; position: absolute; left: 6px; right: 10px; bottom: 5px; height: 10px; background: repeating-linear-gradient(90deg, #D4A857 0 3px, transparent 3px 6px); }

.pfr { width: 100%; height: 100%; border: 7px solid #D4A857; background: #fff; padding: 5px; transform: rotateY(-16deg) rotateZ(6deg); box-shadow: 0 16px 24px -12px rgba(20,23,31,.4); }
.pfr i { display: block; width: 100%; height: 100%; }

.ghost { width: 100%; height: 100%; border: 2px solid rgba(20,23,31,.14); border-radius: 10px; transform: rotateZ(-8deg); }
.cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: spin 34s linear infinite; }
@keyframes spin { from { transform: rotateX(-22deg) rotateY(0); } to { transform: rotateX(-22deg) rotateY(360deg); } }
.cube div { position: absolute; inset: 0; border-radius: 6px; }

.orb { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 14px 22px -10px rgba(20,23,31,.35); }
.pc { position: absolute; border-radius: 50%; background: #E8C479; animation: tw 4s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: .1; } to { opacity: .9; } }

/* ---------- Right Side: Login Card ---------- */
.right { display: grid; place-items: center; padding: 32px; perspective: 1000px; }
.card {
  width: 100%;
  max-width: 390px;
  background: rgba(255,252,246,.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.95);
  border-radius: 26px;
  padding: 26px 28px;
  box-shadow: 0 40px 70px -30px rgba(20,23,31,.35);
  animation: cardin 1s cubic-bezier(.2,.7,.2,1) 1.1s both;
  will-change: transform;
}
@keyframes cardin { from { opacity: 0; translate: 0 26px; } to { opacity: 1; translate: 0 0; } }

.brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
.brand .mark { width: 26px; height: 26px; } .brand .mark svg { width: 15px; height: 15px; }

h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2.4rem; line-height: 1.05; margin: 0 0 4px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 22px; }

label { display: block; font-size: .85rem; font-weight: 500; margin: 0 0 5px; }
.lbl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.lbl-row label { margin-bottom: 0; }

.fld { margin-bottom: 14px; position: relative; }
input[type=text], input[type=password] {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 13px;
  transition: border-color .25s, box-shadow .25s;
}
input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(212,168,87,.22); }

.eye { position: absolute; right: 8px; bottom: 6px; background: none; border: 0; color: var(--muted); font: inherit; font-size: .82rem; padding: 4px 6px; cursor: pointer; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 2px 0 18px; font-size: .88rem; }
.row label { display: flex; gap: 8px; align-items: center; margin: 0; font-weight: 400; color: var(--muted); }

.lnk { background: none; border: 0; padding: 0; font: inherit; color: #7A5514; cursor: pointer; font-weight: 500; }
.lnk:hover { text-decoration: underline; }

.cta {
  width: 100%;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: var(--gold);
  border: 1px solid #C39A45;
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: transform .25s, box-shadow .25s;
}
.cta:hover { transform: translateY(-2px); box-shadow: 0 12px 22px -10px rgba(122,85,20,.6); }
.cta:disabled { opacity: .6; cursor: wait; transform: none; }

.msg { min-height: 1.3em; margin-top: 12px; font-size: .88rem; text-align: center; }
.msg.err { color: #D03238; } .msg.ok { color: #2E8F64; }
[hidden] { display: none !important; }

/* Responsive and Motion Rules */
.card > * { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(1.25s + var(--i,0) * .08s); }
.card > .cta { animation-name: risescale; }
@keyframes rise { from { opacity: 0; transform: translate3d(0,14px,0); } }
@keyframes risescale { from { opacity: 0; transform: translate3d(0,10px,0) scale(.94); } }

@media (max-width: 1100px) { .scene { --k: .5; } .opt { display: none; } }
@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; align-content: start; }
  .logo { left: 18px; top: 16px; }
  #sw { height: calc(660px * var(--s)); max-height: 330px; }
  .scene { --k: 0; }
  .o:not(.keep) { display: none; }
  .right { padding: 0 16px 32px; margin-top: -10px; }
  .card { padding: 24px 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .fl, .sr, .cube, .cm, .gl, .pc, .ped i, .ent, .logo, .card, .card > * { animation: none !important; }
  .hv, .cta { transition: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="logo">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#D4A857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
      </svg>
    </div>
    <span class="name">Studio Console</span>
  </div>

  <div id="sw"><div class="scene" id="scene" aria-hidden="true"></div></div>

  <div class="right">
    <form class="card" id="card" novalidate>
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#D4A857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
          </svg>
        </div>
        <span>Studio Console</span>
      </div>

      <h1>Welcome back</h1>
      <p class="sub">Your albums are waiting.</p>

      <div class="fld">
        <label for="id" id="idl">Email or phone</label>
        <input id="id" type="text" autocomplete="username" placeholder="sana@studio.in">
      </div>

      <div class="fld" id="pwBox">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password">
        <button class="eye" type="button" id="eye" aria-label="Show password">Show</button>
      </div>

      <div class="fld" id="otpBox" hidden>
        <div class="lbl-row">
          <label for="otp">One-time code</label>
          <button class="lnk" type="button" id="sendOtp">Send OTP</button>
        </div>
        <input id="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
      </div>

      <div class="row">
        <label><input type="checkbox" id="keep"> Keep me signed in</label>
        <button class="lnk" type="button" id="forgot">Forgot password?</button>
      </div>

      <button class="cta" type="submit" id="go">Sign In &rarr;</button>

      <button class="lnk" type="button" id="toggleMode" style="display:block;margin:14px auto 0;text-align:center">or sign in with phone OTP</button>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>

<script>
/* ===== Build the 3D scene ===== */
function O(cls, x, y, w, h, ex, ey, dl, d, t, dl2, z, inner, fx) {
  return '<div class="o ent ' + cls + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;--ex:' + ex + ';--ey:' + ey + ';--dl:' + dl + 's"><div class="par" style="--d:' + d + ';--z:' + z + 'px"><div class="fl ' + (fx || '') + '" style="--t:' + t + 's;--dl2:-' + dl2 + 's"><div class="hv">' + inner + '</div></div></div></div>';
}

function ph(k, a, b) {
  var s = {
    land: 'radial-gradient(circle at 72% 28%,rgba(255,255,255,.85) 0 9%,transparent 10%),radial-gradient(120% 55% at 30% 105%,rgba(30,30,50,.28) 0 55%,transparent 56%),linear-gradient(180deg,' + a + ' 0 58%,' + b + ' 58%)',
    port: 'radial-gradient(circle at 50% 33%,#F2D5BF 0 14%,transparent 15%),radial-gradient(ellipse 36% 26% at 50% 96%,#3A3F52 0 90%,transparent 91%),linear-gradient(180deg,' + a + ',' + b + ')',
    abs: 'radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),transparent 40%),linear-gradient(135deg,' + a + ',' + b + ')'
  };
  return '<i style="background:' + s[k] + '"></i>';
}

function pt(x, y, w, h, k, a, b) {
  return '<div class="pt" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px">' + ph(k, a, b) + '</div>';
}

function ring(d, bg, ex, z) {
  return '<div style="position:absolute;left:50%;top:50%;width:' + d + 'px;height:' + d + 'px;margin:-' + (d / 2) + 'px 0 0 -' + (d / 2) + 'px;border-radius:50%;background:' + bg + ';transform:translateZ(' + z + 'px);' + ex + '"></div>';
}

var GLASS = 'radial-gradient(circle at 34% 28%,rgba(255,255,255,.75) 0 5%,transparent 6%),radial-gradient(circle at 62% 70%,rgba(150,120,255,.6),transparent 42%),radial-gradient(circle,#2C3478,#080A18 72%)';

function fp(k, a, b, r) {
  return '<div class="fp" style="--r:' + r + 'deg"><div class="fpb"></div><div class="fpf">' + ph(k, a, b) + '</div></div>';
}

function cube(c) {
  var f = [
    ["translateZ(26px)", 1],
    ["rotateY(180deg) translateZ(26px)", 0.8],
    ["rotateY(90deg) translateZ(26px)", 0.92],
    ["rotateY(-90deg) translateZ(26px)", 0.85],
    ["rotateX(90deg) translateZ(26px)", 1.1],
    ["rotateX(-90deg) translateZ(26px)", 0.75]
  ];
  return '<div class="cube">' + f.map(function(x) {
    return '<div style="background:linear-gradient(135deg,' + c + ',rgba(255,255,255,.5));transform:' + x[0] + ';filter:brightness(' + x[1] + ')"></div>';
  }).join("") + '</div>';
}

function orb(c) {
  return '<div class="orb" style="background:radial-gradient(circle at 32% 28%,#fff,' + c + ' 55%,rgba(0,0,0,.25) 130%)"></div>';
}

var SK = ['#A8C3E0', '#A9BFA0', '#D9A5B2', '#E0B955', '#B9A8E8', '#D9C3A5'];

/* Curved film strip flowing behind the album */
var segs = '', N = 16;
for (var i = 0; i < N; i++) {
  var p = (-82 + 164 * i / (N - 1)) * Math.PI / 180, R = 360;
  segs += '<div class="fs" style="transform:translate3d(' + (R * Math.sin(p)).toFixed(1) + 'px,' + (-80 + 52 * Math.sin(p * 1.7)).toFixed(1) + 'px,' + (-R * Math.cos(p)).toFixed(1) + 'px) rotateY(' + (-p * 180 / Math.PI).toFixed(1) + 'deg) rotateZ(' + (Math.sin(i * .7) * 6).toFixed(1) + 'deg)"><b>' + ph(i % 3 === 1 ? 'port' : 'land', SK[i % 6], SK[(i + 2) % 6]) + '</b></div>';
}

/* Album */
var edges = '';
for (var j = 1; j <= 4; j++) {
  edges += '<div class="pe" style="left:' + (-j * .8) + 'px;transform:translateZ(-' + (j * 3) + 'px)"></div><div class="pe" style="left:' + (180 + j * .8) + 'px;transform:translateZ(-' + (j * 3) + 'px)"></div>';
}
var album = '<div class="ain"><div class="cvr"></div>' + edges + '<div class="pg l">' + pt(14, 14, 152, 104, 'land', '#A8C3E0', '#A9BFA0') + pt(14, 126, 70, 96, 'port', '#D9A5B2', '#E0B955') + pt(92, 132, 74, 84, 'land', '#E0B955', '#B9A8E8') + '</div><div class="pg r">' + pt(14, 14, 98, 132, 'port', '#B9A8E8', '#A8C3E0') + pt(120, 16, 48, 58, 'abs', '#D9A5B2', '#E0B955') + pt(120, 82, 48, 64, 'land', '#A9BFA0', '#A8C3E0') + pt(14, 156, 154, 66, 'land', '#D9A5B2', '#B9A8E8') + '</div></div>';

/* ===== Fit Scene to Column ===== */
var sw = document.getElementById('sw');
function fit() {
  document.documentElement.style.setProperty('--s', Math.min(1, sw.clientWidth / (innerWidth <= 860 ? 700 : 840)));
}
addEventListener('resize', fit);
fit();
[].forEach.call(document.querySelectorAll('#card > *'), function(el, i) { el.style.setProperty('--i', i); });

/* ===== Mouse Parallax with Spring Damping ===== */
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var scene = document.getElementById('scene'), card = document.getElementById('card');
var tx = 0, ty = 0, x = 0, y = 0, vx = 0, vy = 0, run = false;

function enabled() { return !reduce && innerWidth > 860 && !matchMedia('(pointer:coarse)').matches; }
function tick() {
  vx = (vx + (tx - x) * .04) * .84;
  vy = (vy + (ty - y) * .04) * .84;
  x += vx; y += vy;
  scene.style.setProperty('--mx', x.toFixed(4));
  scene.style.setProperty('--my', y.toFixed(4));
  card.style.transform = 'rotateY(' + (x * 4).toFixed(2) + 'deg) rotateX(' + (-y * 3).toFixed(2) + 'deg)';
  if (Math.abs(tx - x) > .0005 || Math.abs(vx) > .0005 || Math.abs(ty - y) > .0005 || Math.abs(vy) > .0005) {
    requestAnimationFrame(tick);
  } else {
    run = false;
  }
}
function kick() { if (!run) { run = true; requestAnimationFrame(tick); } }
addEventListener('pointermove', function(e) {
  if (!enabled()) return;
  tx = (e.clientX / innerWidth - .5) * 2;
  ty = (e.clientY / innerHeight - .5) * 2;
  kick();
});
document.addEventListener('mouseleave', function() { tx = 0; ty = 0; kick(); });

/* ===== Form Controls & OTP Mode Switching ===== */
var $ = function(i) { return document.getElementById(i); };
var mode = 'password';
var msg = $('msg');

function say(t, k) { msg.textContent = t; msg.className = 'msg ' + (k || ''); }

$('eye').onclick = function() {
  var p = $('pw'), s = p.type === 'password';
  p.type = s ? 'text' : 'password';
  this.textContent = s ? 'Hide' : 'Show';
  this.setAttribute('aria-label', s ? 'Hide password' : 'Show password');
};

$('forgot').onclick = function() { say('Password reset link sent to your email.', 'ok'); };

$('toggleMode').onclick = function() {
  mode = (mode === 'password') ? 'otp' : 'password';
  say('');
  if (mode === 'otp') {
    $('idl').textContent = 'Phone number';
    $('id').placeholder = '98765 43210';
    $('id').autocomplete = 'tel';
    $('pwBox').hidden = true;
    $('otpBox').hidden = false;
    $('forgot').hidden = true;
    this.textContent = 'sign in with password';
    $('otp').focus();
  } else {
    $('idl').textContent = 'Email or phone';
    $('id').placeholder = 'sana@studio.in';
    $('id').autocomplete = 'username';
    $('pwBox').hidden = false;
    $('otpBox').hidden = true;
    $('forgot').hidden = false;
    this.textContent = 'or sign in with phone OTP';
    $('id').focus();
  }
};

$('sendOtp').onclick = function() {
  var phone = $('id').value.trim();
  if (!/^\+?[\d\s-]{10,14}$/.test(phone)) {
    say('Enter a valid phone number first.', 'err');
    $('id').focus();
    return;
  }
  say('Sending OTP...', '');
  sendOtp(phone).then(function(r) {
    if (r && r.ok) {
      say('OTP sent. Check your phone.', 'ok');
      $('otp').focus();
    } else {
      say(r && r.error ? r.error : 'Failed to send OTP.', 'err');
    }
  }).catch(function() {
    say('Something went wrong. Try again.', 'err');
  });
};

/* ===== Form Submission ===== */
$('card').onsubmit = function(e) {
  e.preventDefault();
  var id = $('id').value.trim();
  var password = $('pw').value;
  var otp = $('otp').value.trim();
  var keep = $('keep').checked;

  if (!id) {
    say(mode === 'otp' ? 'Enter your phone number.' : 'Enter your email or phone.', 'err');
    $('id').focus();
    return;
  }

  if (mode === 'password' && !password) {
    say('Enter your password.', 'err');
    $('pw').focus();
    return;
  }

  if (mode === 'otp' && !/^\d{6}$/.test(otp)) {
    say('Enter the 6-digit code.', 'err');
    $('otp').focus();
    return;
  }

  $('go').disabled = true;
  say('Signing in...', '');

  authenticate({ mode: mode, id: id, password: password, otp: otp, keep: keep })
    .then(function(r) {
      if (r && r.ok) {
        var session = {
          token: r.token || ('demo-token-' + Date.now()),
          user: r.user || { id: 'u1', username: id, name: 'Sana', role: 'Owner' },
          expiresAt: Date.now() + (keep ? 30 * 86400000 : 86400000)
        };
        var key = 'studio_session';
        if (keep) {
          localStorage.setItem(key, JSON.stringify(session));
          sessionStorage.removeItem(key);
        } else {
          sessionStorage.setItem(key, JSON.stringify(session));
          localStorage.removeItem(key);
        }
        say('Welcome back!', 'ok');
        setTimeout(function() { location.replace('index.html'); }, 600);
      } else {
        say(r && r.error ? r.error : 'Invalid credentials.', 'err');
        $('go').disabled = false;
      }
    })
    .catch(function() {
      say('Something went wrong. Try again.', 'err');
      $('go').disabled = false;
    });
};

/* ===== AUTH HOOKS (Backend Stubs) ===== */
function authenticate(data) {
  return new Promise(function(resolve) {
    setTimeout(function() {
      if (data.id && (data.password || data.otp)) {
        resolve({
          ok: true,
          token: 'demo-token-' + Date.now(),
          user: { id: 'u1', username: data.id, name: 'Sana', role: 'Owner' }
        });
      } else {
        resolve({ ok: false, error: 'Invalid username or password.' });
      }
    }, 700);
  });
}

function sendOtp(phone) {
  return new Promise(function(resolve) {
    setTimeout(function() {
      resolve({ ok: true });
    }, 600);
  });
}
