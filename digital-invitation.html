<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Invitation | Studio Console</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Authentication Guard -->
  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
</head>
<body>

  <div class="app-shell">
    
    <!-- Floating Card Sidebar Column -->
    <aside class="sidebar-column" id="sidebarCol">
      <div class="side">
        <div class="side-brand">
          <div class="side-brand-icon"><i class="ti ti-camera"></i></div>
          <span class="side-brand-name">Studio Console</span>
        </div>
        <nav class="side-nav" id="sidebar-nav" aria-label="Main Navigation"></nav>
        <div class="side-user">
          <div class="side-user-info">
            <div class="side-user-avatar">S</div>
            <div>
              <div style="font-weight: 600; font-size: 13px;">Sana</div>
              <div style="font-size: 11px; color: var(--muted);">Owner</div>
            </div>
          </div>
          <button type="button" class="lnk" onclick="logout()" title="Sign Out" style="color: var(--error);">
            <i class="ti ti-logout" style="font-size: 18px;"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Body -->
    <main class="app-main">
      
      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="menu-drawer-toggle" onclick="toggleDrawer()" aria-label="Toggle Navigation">
            <i class="ti ti-menu-2"></i>
          </button>
          <div class="topbar-search" id="topbarSearch">
            <i class="ti ti-search"></i>
            <input type="text" id="searchInput" placeholder="Search invitations..." aria-label="Search">
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <!-- Main Workspace Content -->
      <div id="main-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <div>
            <h1>Digital Invitation</h1>
            <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">Create, share and track beautiful invitations with RSVP.</p>
          </div>
        </div>

        <div class="glass-card" style="padding: 60px 20px; text-align: center; margin-top: 20px;">
          <div style="font-size: 44px; color: var(--gold-accent, #C5A059); margin-bottom: 12px;">
            <i class="ti ti-mail-heart"></i>
          </div>
          <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 8px;">Coming soon</h2>
          <p style="color: var(--muted); font-size: 14px; max-width: 480px; margin: 0 auto;">
            The Digital Invitation suite is currently under development. You will soon be able to create, share and track interactive wedding invitations with RSVP capabilities.
          </p>
        </div>
      </div>

    </main>

  </div>

  <!-- Toast Container -->
  <div id="toast" class="toast-msg" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/helpers.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      renderShell({
        active: 'digital-invitation',
        title: 'Digital Invitation',
        searchPlaceholder: 'Search invitations...'
      });
    });
  </script>
</body>
</html>
